<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fav-g" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b6ff5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Outer ripple ring — dashed, fading -->
  <circle cx="16" cy="16" r="14.5" stroke="url(#fav-g)" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 2.5"/>
  <!-- Middle ripple ring — solid -->
  <circle cx="16" cy="16" r="9.5" stroke="url(#fav-g)" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Center pebble — filled gradient -->
  <circle cx="16" cy="16" r="4.8" fill="url(#fav-g)"/>
</svg>
